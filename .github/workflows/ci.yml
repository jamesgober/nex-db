name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Run every JS action on Node.js 24 ahead of GitHub's forced migration,
  # silencing "Node.js 20 actions are deprecated" runner warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --no-default-features
      # TOTP without passkeys: pure Rust, no AWS-LC.
      - name: Clippy (TOTP only)
        run: cargo clippy --all-targets --no-default-features --features split-auth,totp,content -- -D warnings
      - name: Test (TOTP only)
        run: cargo test --no-default-features --features split-auth,totp,content
      - name: Build examples
        run: cargo build --examples
      # Sign up, sign in, validate; the second run stops without closing the
      # database, and the third finds everything from before.
      - name: Run the site example
        shell: bash
        run: |
          dir="$RUNNER_TEMP/nex-db-site"
          cargo run --example site -- "$dir"
          cargo run --example site -- --crash "$dir"
          cargo run --example site -- "$dir"
      # Both modes: a doc link to a feature-gated item breaks only when that
      # feature is off.
      - name: Doc (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The static build: TOTP on musl with no C compiler at all, so nothing in
  # the tree compiles C (AWS-LC comes only with `passkey` or `audit-export`).
  musl:
    name: musl (TOTP, no C compiler / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # blake3's build script looks for a C compiler for its assembly and
      # uses its Rust intrinsics without one, which the next step forces.
      - name: No AWS-LC in the tree
        shell: bash
        run: |
          tree=$(cargo tree -e normal,build --no-default-features --features split-auth,totp,content             --target x86_64-unknown-linux-musl --prefix none)
          if echo "$tree" | grep -E '^(aws-lc|cmake )'; then
            echo "the TOTP tree builds a C library"
            exit 1
          fi
      - name: Build and test for musl with no C compiler
        run: cargo test --no-default-features --features split-auth,totp,content --target x86_64-unknown-linux-musl
        # Every C compiler names a file that does not exist, so any C build
        # fails; rust-lld links the musl binaries.
        env:
          CC: /nonexistent/cc
          HOST_CC: /nonexistent/cc
          TARGET_CC: /nonexistent/cc
          CXX: /nonexistent/cc
          CC_x86_64_unknown_linux_musl: /nonexistent/cc
          CC_x86_64_unknown_linux_gnu: /nonexistent/cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld

  loom:
    name: Loom models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Loom models (session table slots, commit ordering)
        run: cargo test --release --lib loom
        env:
          RUSTFLAGS: "-D warnings --cfg nex_loom"
          LOOM_MAX_PREEMPTIONS: "3"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: cargo package

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit
        run: cargo audit
      - name: Deny
        run: cargo deny check
