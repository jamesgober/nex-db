# =============================================================================
#  R E P S   ·   nex-db
# =============================================================================
[package]
name    = "nex-db"
version = "0.4.1"

# Minimum Supported Rust Version (MSRV)
# 1.85: the baseline of the db-collection crates nex-db builds on.
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Embedded database with typed engines on one commit log."

# Keywords (5 max)
keywords = ["database", "embedded", "storage"]

# Categories
categories = ["database-implementations"]

# Links
repository = "https://github.com/jamesgober/nex-db"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# Not published until James decides (dev/PLAN.md, open decision OD-1).
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "nex_db"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
# Engines are modules behind features (dev/PLAN.md D-001). The core (commit
# log, catalog, recovery) is always built.
[features]
default = ["auth", "content"]
# The auth engine: accounts, sessions, password hashing.
auth = ["dep:lsm-db", "dep:audit-trail", "crypt-io/kdf-argon2"]
# The content engine: entities and routes.
content = ["dep:lsm-db"]
# An observer that reports into metrics-lib (`nex_db::metrics::Recorder`).
metrics = ["dep:metrics-lib"]
# Second factors: TOTP and passkeys, through crypt-io's `otp` and `sign`
# modules. Off by default: it builds crypt-io's C backend (AWS-LC).
mfa = [
    "auth",
    "crypt-io/otp",
    "crypt-io/hash-sha2",
    "crypt-io/sign-p256",
    "crypt-io/sign-ed25519",
    "crypt-io/sign-rsa",
]


# DEPENDENCIES
# #################################
# First-party crates by published version only, never `path`. No third-party
# runtime dependency of nex-db's own; the ones these crates bring are recorded
# as temporary exceptions in dev/PLAN.md (OD-5).
[dependencies]
wal-db = "1.1.1"
id-forge = { version = "1.0", default-features = false, features = ["ulid"] }
crypt-io = { version = "1.5", default-features = false, features = [
    "std",
    "zeroize",
    "hash-blake3",
    "mac-blake3",
    "aead-chacha20",
] }
# `durability` stays off: the core commit log is the write-ahead log.
lsm-db = { version = "1.1", default-features = false, features = ["std"], optional = true }
# The auth audit chain. No third-party dependency with default features off;
# hashed with keyed BLAKE3 through crypt-io.
audit-trail = { version = "1.1", default-features = false, features = ["std"], optional = true }
# The `metrics` feature's registry. No third-party dependency with only these
# features.
metrics-lib = { version = "2.1", default-features = false, features = ["count", "timer"], optional = true }


# The `mfa` feature builds crypt-io's AWS-LC backend; on Windows x86-64 it
# takes AWS-LC's prebuilt NASM objects, so no NASM is needed. A weak feature:
# nothing changes unless `mfa` is on.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
crypt-io = { version = "1.5", default-features = false, features = ["prebuilt-nasm"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Concurrency models of the lock-free table and the commit turnstile, built
# only with `RUSTFLAGS="--cfg nex_loom" cargo test --release --lib loom`.
[target.'cfg(nex_loom)'.dev-dependencies]
loom = "0.7"


# TARGETS
# #################################
[[example]]
name = "site"
required-features = ["auth", "content"]

[[test]]
name = "commit"
required-features = ["auth", "content"]

[[test]]
name = "recovery"
required-features = ["auth", "content"]

[[test]]
name = "content"
required-features = ["content"]

[[test]]
name = "feed"
required-features = ["auth", "content"]

[[test]]
name = "observe"
required-features = ["auth", "content"]

[[test]]
name = "kill"
required-features = ["auth", "content"]

[[bench]]
name = "core"
harness = false
required-features = ["auth", "content"]

[[bench]]
name = "table"
harness = false


# DEV PROFILE
# #################################
# Argon2id is unusably slow without optimisation; tests and examples hash
# passwords at the cost a release build pays.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[[test]]
name = "realms"
required-features = ["auth", "content"]

[[test]]
name = "erasure"
required-features = ["auth"]
